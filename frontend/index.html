<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EOB / ERA Payment Posting Extractor</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>EOB / ERA Payment Posting Extractor</h1>
      <p class="subtitle">Upload an insurance EOB or ERA/ERN PDF and let AI extract the payment posting data.</p>
    </header>

    <section class="upload-card">
      <form id="upload-form">
        <label for="pdf-input" class="drop-zone" id="drop-zone">
          <span id="drop-zone-text">Click to choose a PDF, or drag and drop it here</span>
          <input type="file" id="pdf-input" name="file" accept="application/pdf" hidden />
        </label>
        <button type="submit" id="submit-btn" disabled>Extract Data</button>
      </form>
      <div id="status" class="status"></div>
    </section>

    <section id="results-section" class="results-section hidden">
      <div class="results-header">
        <h2>Extracted Payment Data</h2>
        <div class="results-actions">
          <span id="row-count"></span>
          <button id="download-csv-btn">Download CSV</button>
        </div>
      </div>
      <div class="table-wrapper">
        <table id="results-table">
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
